[tool:pytest]
# pytest configuration file for GraphX-Temporal

# Test discovery
testpaths = test
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Output formatting
addopts =
    -v
    --strict-markers
    --strict-config
    --tb=short
    --maxfail=10
    --durations=10

# Warning settings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Markers for test categorization
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    sampling: marks tests related to sampling functionality
    loader: marks tests related to data loading functionality
    data_creation: marks tests related to data structure creation

# Minimum version
minversion = 6.0

# Timeout for tests (in seconds)
timeout = 300

# Show locals on failure
showlocals = True

# Console output style
console_output_style = progress