
fit:
  model:
    class_path: tgx.baselines.cl_ond.arch.DownstreamModel
    init_args:
      input_dim: 172
      hidden_dim: 128
      output_dim: 128
      pretrained_ckpt_path: checkpoints/cl-ond/mooc/pretrain/best.ckpt
      evaluator:
        class_path: tgx.models.LinkPredictionEvaluator
        init_args:
          input_dim: ${fit.model.init_args.output_dim}

  # Data parameters (data class parameters) - LP DataModule
  data:
    class_path: tgx.data.LPDataModule
    init_args:
      dataset: mooc
      data_dir: ./datasets
      mode: inductive  # transductive or inductive
      split_ratio: [0.2, 0.15, 0.15]  # train, val, test
      shuffle_train: true
      negative_sampling_ratio: 1.0  # No additional negative sampling

  # Training parameters
  trainer:
    accelerator: gpu  # auto, cpu, gpu, tpu, mps
    devices: 1
    max_epochs: 100
    accumulate_grad_batches: 1
    log_every_n_steps: 1

  # Callbacks
    callbacks:
    #   - class_path: lightning.pytorch.callbacks.ModelCheckpoint
    #     init_args:
    #       dirpath: ./checkpoints/cl-ond/${fit.data.init_args.dataset}/lp-${fit.data.init_args.mode}/
    #       filename: best
    #       monitor: val/loss
    #       mode: min
    #       save_top_k: 1
    #       save_last: true
    #       verbose: false

    #   - class_path: lightning.pytorch.callbacks.EarlyStopping
    #     init_args:
    #       monitor: val/loss
    #       mode: min
    #       patience: 10
    #       verbose: false

      - class_path: lightning.pytorch.callbacks.RichProgressBar
        init_args:
          leave: false

    logger: 
      class_path: lightning.pytorch.loggers.CSVLogger
      init_args:
        save_dir: logs
        name: cl-ond/
